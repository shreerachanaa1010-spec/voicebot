<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>Talk to Rachanaa</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');

      :root {
        color-scheme: light;
        font-family: 'Manrope', sans-serif;
        color: #20251f;
        background: #f3f5ef;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }

      .shell { max-width: 860px; min-height: 100vh; margin: auto; padding: 28px 28px 36px; display: flex; flex-direction: column; }
      header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #dce1d7; }
      .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; }
      .mark { width: 30px; height: 30px; display: grid; place-items: center; color: #f7f8f2; background: #28664d; border-radius: 9px; }
      .status { display: flex; align-items: center; gap: 9px; color: #59645b; font-family: 'DM Mono', monospace; font-size: 11px; }
      .status-orb { position: relative; width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border: 1px solid #d5ddd1; border-radius: 50%; }
      .status-orb::before { width: 8px; height: 8px; content: ''; background: #72a77a; border-radius: 50%; }
      .status-orb::after { position: absolute; inset: 3px; content: ''; border: 1px solid transparent; border-radius: 50%; }
      body[data-state="listening"] .status-orb::before { background: #28664d; }
      body[data-state="listening"] .status-orb::after { border-color: #28664d; animation: pulse-ring 1.15s ease-out infinite; }
      body[data-state="thinking"] .status-orb::before { background: #c17a31; }
      body[data-state="thinking"] .status-orb::after { border-color: #c17a31; border-right-color: transparent; animation: spin-ring 1s linear infinite; }
      body[data-state="speaking"] .status-orb::before { background: #4a7793; }
      body[data-state="speaking"] .status-orb::after { border-color: #4a7793; animation: speak-ring .7s ease-in-out infinite alternate; }
      @keyframes pulse-ring { from { transform: scale(.65); opacity: .8; } to { transform: scale(1.35); opacity: 0; } }
      @keyframes spin-ring { to { transform: rotate(360deg); } }
      @keyframes speak-ring { from { transform: scale(.8); opacity: .45; } to { transform: scale(1.12); opacity: 1; } }
      main { flex: 1; display: flex; flex-direction: column; padding: 38px 0 24px; }
      .intro { margin: 0 0 16px; color: #788078; font-family: 'DM Mono', monospace; font-size: 11px; text-transform: uppercase; }
      .question-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
      .question-chip { padding: 8px 11px; color: #34493b; background: #fff; border: 1px solid #d5ddd1; border-radius: 5px; font-size: 11px; line-height: 1.4; text-align: left; }
      .question-chip:hover { background: #e8eee5; border-color: #93aa96; }
      #conversation { display: flex; flex-direction: column; gap: 14px; flex: 1; }
      .message { max-width: min(76%, 610px); padding: 13px 16px; border-radius: 4px 14px 14px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .message.assistant { align-self: flex-start; background: #fff; border: 1px solid #e6e9e1; }
      .message.user { align-self: flex-end; color: #fff; background: #28664d; border-radius: 14px 4px 14px 14px; }
      .message.error { color: #8c3d32; background: #fff1ed; border: 1px solid #f1d4ca; }
      .composer { padding: 10px; background: #fff; border: 1px solid #dce1d7; border-radius: 7px; box-shadow: 0 8px 26px #3443310b; }
      textarea { display: block; width: 100%; min-height: 56px; padding: 6px 7px; resize: vertical; color: inherit; background: transparent; border: 0; outline: 0; font-size: 14px; line-height: 1.6; }
      textarea::placeholder { color: #929a91; }
      .controls { display: flex; justify-content: space-between; align-items: center; padding: 7px 2px 0; }
      .hint { color: #858d83; font-family: 'DM Mono', monospace; font-size: 10px; }
      .actions { display: flex; gap: 8px; }
      .hands-free { display: inline-flex; align-items: center; gap: 7px; color: #59645b; font-size: 11px; white-space: nowrap; }
      .hands-free input { width: 15px; height: 15px; margin: 0; accent-color: #28664d; }
      .stop-button, .send-button { min-height: 37px; border-radius: 5px; }
      .stop-button { display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; color: #7f3930; background: #fff; border: 1px solid #e6d5d0; font-size: 12px; }
      .stop-button:hover:not(:disabled) { background: #fff3ef; }
      .talk-button { width: 100%; min-height: 62px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 11px; color: #fff; background: #28664d; border: 0; border-radius: 6px; font-size: 15px; font-weight: 700; }
      .talk-button[aria-pressed="true"] { background: #b2493c; }
      .talk-button:disabled { opacity: .8; }
      .send-button { padding: 0 16px; color: #fff; background: #28664d; font-size: 12px; font-weight: 700; }
      .send-button { border: 0; }
      button:disabled { cursor: wait; opacity: .55; }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 16px; color: #899187; font-family: 'DM Mono', monospace; font-size: 10px; }
      .portfolio-links { display: flex; flex-wrap: wrap; gap: 14px; }
      .portfolio-links[hidden] { display: none; }
      .portfolio-links a { color: #28664d; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
      @media (max-width: 560px) {
        .shell { padding: 18px 16px 24px; }
        main { padding-top: 28px; }
        .message { max-width: 90%; }
        .controls { align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .hint { max-width: 100%; line-height: 1.5; }
        .actions { width: 100%; justify-content: flex-end; }
        footer { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body data-state="ready">
    <div class="shell">
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">R</span> Rachanaa Shree</div>
        <div class="status"><span class="status-orb" aria-hidden="true"></span><span id="status">READY</span></div>
      </header>
      <main>
        <p class="intro">Interview / Bengaluru</p>
        <section class="question-list" id="questions" aria-label="Suggested questions"></section>
        <section id="conversation" aria-live="polite" aria-label="Conversation">
          <div class="message assistant">Hi, I’m Rachanaa. Ask me about my engineering work or my move toward AI.</div>
        </section>
      </main>
      <form class="composer" id="chat-form">
        <button class="talk-button" id="mic" type="button" aria-label="Tap to talk" title="Tap to talk" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg>
          <span id="mic-label">Tap to talk</span>
        </button>
        <textarea id="message" rows="2" placeholder="Ask Rachanaa a question..." aria-label="Ask Rachanaa a question"></textarea>
        <div class="controls">
          <span class="hint" id="voice-hint">Works in modern browsers. Allow microphone access; audio is transcribed by Groq.</span>
          <div class="actions">
            <label class="hands-free"><input id="hands-free" type="checkbox"><span>Hands-free</span></label>
            <button class="stop-button" id="stop-button" type="button" disabled aria-label="Stop voice interaction" title="Stop listening, generation, or speech">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"></rect></svg>
              <span>Stop</span>
            </button>
            <button class="send-button" id="send-button" type="submit">Send</button>
          </div>
        </div>
      </form>
      <footer>
        <span>Rachanaa Shree · Bengaluru</span>
        <nav class="portfolio-links" id="portfolio-links" aria-label="Portfolio links" hidden></nav>
      </footer>
    </div>
    <script>
      const form = document.querySelector('#chat-form');
      const input = document.querySelector('#message');
      const conversation = document.querySelector('#conversation');
      const status = document.querySelector('#status');
      const sendButton = document.querySelector('#send-button');
      const stopButton = document.querySelector('#stop-button');
      const mic = document.querySelector('#mic');
      const micLabel = document.querySelector('#mic-label');
      const voiceHint = document.querySelector('#voice-hint');
      const handsFree = document.querySelector('#hands-free');
      const history = [];
      let recognitionAvailable = false;
      let microphoneBlocked = false;
      let requestController = null;
      let startListening = null;
      let abortListening = () => {};
      let availableVoices = [];
      let speechQueue = [];
      let speechRemainder = '';
      let speechActive = false;
      let speechStreamFinished = false;

      function refreshVoices() {
        availableVoices = window.speechSynthesis.getVoices();
      }

      if ('speechSynthesis' in window) {
        refreshVoices();
        window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
      }
      const questions = [
        'What should we know about your life story?',
        "What's your number one superpower?",
        "What are the top three areas you'd like to grow in?",
        'What misconception do your coworkers have about you?',
        'How do you push your boundaries and limits?',
      ];
      const portfolioLinks = [
        { label: 'GitHub', href: '' },
        { label: 'LinkedIn', href: '' },
        { label: 'Resume', href: '' },
        { label: 'Play Store', href: '' },
      ];

      const portfolioNav = document.querySelector('#portfolio-links');
      for (const linkInfo of portfolioLinks) {
        try {
          const url = new URL(linkInfo.href);
          if (url.protocol !== 'https:') continue;
          const link = document.createElement('a');
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = linkInfo.label;
          portfolioNav.append(link);
        } catch {
          continue;
        }
      }
      portfolioNav.hidden = portfolioNav.childElementCount === 0;

      function show(role, content, extraClass = '') {
        const message = document.createElement('div');
        message.className = `message ${role === 'user' ? 'user' : 'assistant'} ${extraClass}`.trim();
        const label = document.createElement('strong');
        label.textContent = role === 'user' ? 'You: ' : 'Rachanaa: ';
        const textNode = document.createTextNode(content);
        message.append(label, textNode);
        conversation.append(message);
        message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return { message, textNode };
      }

      function setStatus(value) {
        const state = value.toLowerCase().replace(/\.\.\.$/, '').replace(/\s+/g, '-');
        status.textContent = value.toUpperCase();
        document.body.dataset.state = state;
        stopButton.disabled = !['listening', 'thinking', 'speaking'].includes(state);
      }

      function setReady() {
        setStatus('Ready');
        mic.disabled = !recognitionAvailable || microphoneBlocked;
        micLabel.textContent = mic.disabled ? 'Voice input unavailable' : 'Tap to talk';
        handsFree.disabled = !recognitionAvailable || microphoneBlocked;
        mic.setAttribute('aria-pressed', 'false');
        mic.setAttribute('aria-label', mic.disabled ? 'Voice input unavailable' : 'Tap to talk');
        mic.title = mic.disabled ? 'Voice input is unavailable; use the text box' : 'Tap to talk';
      }

      async function readChatStream(response, onToken) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let reply = '';

        function processFrame(frame) {
          const data = frame.split(/\r?\n/)
            .filter((line) => line.startsWith('data:'))
            .map((line) => line.slice(5).trim())
            .join('\n');
          if (!data || data === '[DONE]') return;
          try {
            const event = JSON.parse(data);
            if (typeof event.content === 'string') {
              reply += event.content;
              onToken(event.content);
            }
          } catch {
            return;
          }
        }

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let boundary;
            while ((boundary = buffer.search(/\r?\n\r?\n/)) !== -1) {
              const frame = buffer.slice(0, boundary);
              const delimiter = buffer.slice(boundary).startsWith('\r\n\r\n') ? 4 : 2;
              buffer = buffer.slice(boundary + delimiter);
              processFrame(frame);
            }
          }
          buffer += decoder.decode();
          if (buffer.trim()) processFrame(buffer);
        } finally {
          reader.releaseLock();
        }
        return reply;
      }

      async function ask(question) {
        const content = question.trim();
        if (!content || sendButton.disabled) return;

        speechQueue = [];
        speechRemainder = '';
        speechActive = false;
        speechStreamFinished = false;
        const controller = new AbortController();
        requestController = controller;
        history.push({ role: 'user', content });
        show('user', content);
        sendButton.disabled = true;
        mic.disabled = true;
        micLabel.textContent = 'Thinking...';
        mic.setAttribute('aria-pressed', 'false');
        mic.setAttribute('aria-label', 'Thinking');
        setStatus('Thinking');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();

        let assistantMessage = null;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: history }),
            signal: controller.signal,
          });
          if (!response.ok) {
            const data = await response.json();
            const message = response.status === 429
              ? data.reply || 'Too many questions too quickly. Please wait a minute and try again.'
              : response.status === 503
                ? data.reply || 'The chat service is temporarily unavailable. Please try again soon.'
                : data.reply || 'The request failed. Please try again.';
            throw new Error(message);
          }
          assistantMessage = show('assistant', '');
          const reply = await readChatStream(response, (token) => {
            assistantMessage.textNode.appendData(token);
            speechRemainder += token;
            queueCompleteSentences();
          });
          if (!reply.trim()) throw new Error('I did not receive a reply. Please try again.');
          history.push({ role: 'assistant', content: reply });
          finishSpeechStream();
        } catch (error) {
          history.pop();
          if (error.name !== 'AbortError') {
            if (assistantMessage && !assistantMessage.textNode.textContent) assistantMessage.message.remove();
            show('assistant', error.message || 'Sorry, I could not connect. Please try again.', 'error');
          }
          speechQueue = [];
          speechRemainder = '';
          speechStreamFinished = false;
          setReady();
        } finally {
          if (requestController === controller) requestController = null;
          sendButton.disabled = false;
          input.focus();
        }
      }

      function bestEnglishVoice() {
        const voices = (availableVoices.length ? availableVoices : window.speechSynthesis.getVoices())
          .filter((voice) => voice.lang.toLowerCase().startsWith('en'));
        return voices.find((voice) => voice.lang.toLowerCase() === 'en-in')
          || voices.find((voice) => voice.default && voice.localService)
          || voices.find((voice) => voice.localService)
          || voices[0];
      }

      function queueCompleteSentences() {
        const boundary = /[.!?]["'”’)]*\s+/g;
        let match;
        let consumed = 0;
        while ((match = boundary.exec(speechRemainder))) {
          const sentence = speechRemainder.slice(consumed, boundary.lastIndex).trim();
          if (sentence) speechQueue.push(sentence);
          consumed = boundary.lastIndex;
        }
        if (consumed) speechRemainder = speechRemainder.slice(consumed);
        speakNextSentence();
      }

      function finishSpeechTurn() {
        speechStreamFinished = false;
        setReady();
        if (handsFree.checked && startListening) startListening();
      }

      function finishSpeechStream() {
        speechStreamFinished = true;
        if (speechRemainder.trim()) speechQueue.push(speechRemainder.trim());
        speechRemainder = '';
        speakNextSentence();
      }

      function speakNextSentence() {
        if (speechActive) return;
        if (!speechQueue.length) {
          if (speechStreamFinished) finishSpeechTurn();
          return;
        }
        if (!('speechSynthesis' in window)) {
          speechQueue = [];
          if (speechStreamFinished) finishSpeechTurn();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(speechQueue.shift());
        const voice = bestEnglishVoice();
        utterance.lang = voice?.lang || 'en-IN';
        if (voice) utterance.voice = voice;
        speechActive = true;
        utterance.onstart = () => {
          setStatus('Speaking');
          micLabel.textContent = 'Speaking...';
          mic.setAttribute('aria-label', 'Speaking');
        };
        utterance.onend = () => {
          speechActive = false;
          if (speechQueue.length || speechStreamFinished) speakNextSentence();
          else if (status.textContent !== 'READY') setStatus('Thinking');
        };
        utterance.onerror = () => {
          speechActive = false;
          if (speechQueue.length || speechStreamFinished) speakNextSentence();
          else if (status.textContent !== 'READY') setStatus('Thinking');
        };
        window.speechSynthesis.speak(utterance);
      }

      questions.forEach((question) => {
        const button = document.createElement('button');
        button.className = 'question-chip';
        button.type = 'button';
        button.textContent = question;
        button.addEventListener('click', () => ask(question));
        document.querySelector('#questions').append(button);
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (question) {
          input.value = '';
          ask(question);
        }
      });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const canRecordAudio = Boolean(window.MediaRecorder && navigator.mediaDevices?.getUserMedia);
      let recognition = null;
      let transcriptParts = [];
      let recorder = null;
      let mediaStream = null;
      let audioChunks = [];
      let discardRecording = false;
      let recordingAttempt = 0;
      let silenceTimer = null;
      let audioContext = null;
      let discardBrowserTranscript = false;
      recognitionAvailable = canRecordAudio || Boolean(SpeechRecognition);
      handsFree.disabled = !recognitionAvailable;

      function releaseAudioResources() {
        if (silenceTimer) window.clearInterval(silenceTimer);
        silenceTimer = null;
        if (mediaStream) mediaStream.getTracks().forEach((track) => track.stop());
        mediaStream = null;
        if (audioContext) {
          const context = audioContext;
          audioContext = null;
          context.close().catch(() => {});
        }
      }

      function finishRecording(submit) {
        if (!recorder || recorder.state === 'inactive') return;
        discardRecording = !submit;
        if (submit) micLabel.textContent = 'Transcribing...';
        recorder.stop();
      }

      function monitorSilence(stream, activeRecorder) {
        const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextConstructor) return;

        try {
          audioContext = new AudioContextConstructor();
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;
          audioContext.createMediaStreamSource(stream).connect(analyser);
          const samples = new Uint8Array(analyser.fftSize);
          const startedAt = Date.now();
          let lastVoiceAt = startedAt;
          let heardVoice = false;

          silenceTimer = window.setInterval(() => {
            if (activeRecorder.state !== 'recording') return;
            analyser.getByteTimeDomainData(samples);
            const energy = Math.sqrt(samples.reduce((sum, sample) => sum + ((sample - 128) / 128) ** 2, 0) / samples.length);
            if (energy > 0.025) {
              heardVoice = true;
              lastVoiceAt = Date.now();
            }
            if ((heardVoice && Date.now() - lastVoiceAt > 1300) || (!heardVoice && Date.now() - startedAt > 12_000)) {
              finishRecording(true);
            }
          }, 160);
          audioContext.resume().catch(() => {});
        } catch {
          if (silenceTimer) window.clearInterval(silenceTimer);
          silenceTimer = null;
          if (audioContext) {
            const context = audioContext;
            audioContext = null;
            context.close().catch(() => {});
          }
        }
      }

      async function transcribeAudio(blob) {
        if (!blob.size) {
          voiceHint.textContent = 'I did not catch that. Tap to try again or type your question below.';
          setReady();
          return;
        }

        const controller = new AbortController();
        requestController = controller;
        sendButton.disabled = true;
        mic.disabled = true;
        setStatus('Thinking');
        micLabel.textContent = 'Transcribing...';

        try {
          const formData = new FormData();
          const extension = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
          formData.append('audio', blob, `question.${extension}`);
          const response = await fetch('/api/transcribe', {
            method: 'POST',
            body: formData,
            signal: controller.signal,
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Voice transcription failed. Please try again.');
          const transcript = String(data.text || '').trim();
          if (!transcript) {
            voiceHint.textContent = 'I did not catch that. Tap to try again or type your question below.';
            setReady();
            return;
          }

          if (requestController === controller) requestController = null;
          sendButton.disabled = false;
          ask(transcript);
        } catch (error) {
          if (error.name !== 'AbortError') {
            show('assistant', error.message || 'Voice transcription failed. Please try again or type your question.', 'error');
            voiceHint.textContent = 'Voice transcription failed. Tap to retry or type your question below.';
          }
          setReady();
        } finally {
          if (requestController === controller) {
            requestController = null;
            sendButton.disabled = false;
          }
        }
      }

      async function startRecording() {
        const attempt = ++recordingAttempt;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
          if (attempt !== recordingAttempt) {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }

          mediaStream = stream;
          audioChunks = [];
          discardRecording = false;
          const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
            .find((type) => MediaRecorder.isTypeSupported(type));
          recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
          const activeRecorder = recorder;
          activeRecorder.addEventListener('dataavailable', (event) => {
            if (event.data.size) audioChunks.push(event.data);
          });
          activeRecorder.addEventListener('error', () => {
            releaseAudioResources();
            recorder = null;
            voiceHint.textContent = 'Recording failed. Tap to retry or type your question below.';
            setReady();
          });
          activeRecorder.addEventListener('stop', () => {
            const shouldSubmit = !discardRecording;
            const chunks = audioChunks;
            const type = activeRecorder.mimeType || 'audio/webm';
            audioChunks = [];
            recorder = null;
            mic.setAttribute('aria-pressed', 'false');
            releaseAudioResources();
            if (!shouldSubmit) {
              setReady();
              return;
            }
            void transcribeAudio(new Blob(chunks, { type }));
          });
          activeRecorder.start(250);
          setStatus('Listening');
          micLabel.textContent = 'Listening... Tap to send';
          monitorSilence(stream, activeRecorder);
        } catch (error) {
          if (attempt !== recordingAttempt) return;
          const permissionBlocked = ['NotAllowedError', 'PermissionDeniedError', 'SecurityError'].includes(error.name);
          const noDevice = ['NotFoundError', 'DevicesNotFoundError'].includes(error.name);
          if (permissionBlocked || noDevice) {
            microphoneBlocked = true;
            mic.disabled = true;
            handsFree.disabled = true;
            micLabel.textContent = 'Voice input unavailable';
            mic.setAttribute('aria-pressed', 'false');
            mic.setAttribute('aria-label', 'Voice input unavailable');
            setStatus('Voice unavailable');
            voiceHint.textContent = noDevice
              ? 'No microphone was found. Check the device or type your question below.'
              : 'Microphone is blocked. Click the lock icon by the address bar, allow microphone access, then reload.';
          } else {
            voiceHint.textContent = 'Voice recording could not start. Tap to retry or type your question below.';
            setReady();
          }
        }
      }

      if (canRecordAudio) {
        startListening = () => {
          if (!recognitionAvailable || microphoneBlocked) return;
          mic.setAttribute('aria-pressed', 'true');
          mic.setAttribute('aria-label', 'Stop and transcribe');
          mic.title = 'Tap to finish and transcribe';
          micLabel.textContent = 'Starting microphone...';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          void startRecording();
        };
        abortListening = () => {
          recordingAttempt += 1;
          if (recorder && recorder.state !== 'inactive') finishRecording(false);
          else releaseAudioResources();
        };
        mic.addEventListener('click', () => {
          if (recorder && recorder.state === 'recording') finishRecording(true);
          else startListening();
        });
        voiceHint.textContent = 'Audio is transcribed by Groq. Speak, then pause or tap to send.';
      } else if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.interimResults = false;
        recognition.onstart = () => {
          transcriptParts = [];
          mic.setAttribute('aria-pressed', 'true');
          setStatus('Listening');
          micLabel.textContent = 'Listening...';
        };
        recognition.onresult = (event) => {
          transcriptParts = Array.from(event.results)
            .filter((result) => result.isFinal)
            .map((result) => result[0].transcript.trim())
            .filter(Boolean);
        };
        recognition.onerror = (event) => {
          const error = event.error || 'unknown';
          const blocked = ['not-allowed', 'service-not-allowed', 'audio-capture'].includes(error);
          if (blocked) {
            microphoneBlocked = true;
            mic.disabled = true;
            handsFree.disabled = true;
            setStatus('Voice unavailable');
            voiceHint.textContent = error === 'audio-capture'
              ? 'No microphone was found. Check the device or type your question below.'
              : 'Microphone is blocked. Click the lock icon by the address bar, allow microphone access, then reload.';
          } else {
            voiceHint.textContent = error === 'no-speech'
              ? 'I did not catch that. Tap to try again or type your question below.'
              : `Voice input had a temporary error (${error}). Tap to retry or type your question below.`;
            setReady();
          }
        };
        recognition.onend = () => {
          if (discardBrowserTranscript) {
            discardBrowserTranscript = false;
            transcriptParts = [];
            setReady();
            return;
          }
          const transcript = transcriptParts.join(' ').replace(/\s+/g, ' ').trim();
          transcriptParts = [];
          if (transcript) ask(transcript);
          else if (status.textContent === 'LISTENING') setReady();
        };
        startListening = () => {
          if (microphoneBlocked) return;
          mic.setAttribute('aria-pressed', 'true');
          mic.title = 'Stop listening';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          try {
            recognition.start();
          } catch {
            setReady();
          }
        };
        abortListening = () => {
          discardBrowserTranscript = true;
          try { recognition.abort(); } catch { setReady(); }
        };
        mic.addEventListener('click', () => {
          if (mic.getAttribute('aria-pressed') === 'true') recognition.stop();
          else startListening();
        });
      } else {
        mic.disabled = true;
        handsFree.disabled = true;
        micLabel.textContent = 'Voice input unavailable';
        mic.title = 'Voice input is not supported in this browser';
        mic.setAttribute('aria-label', 'Voice input is not supported in this browser');
        voiceHint.textContent = 'Microphone recording is not supported here. Type your question below.';
      }

      stopButton.addEventListener('click', () => {
        abortListening();
        speechQueue = [];
        speechRemainder = '';
        speechStreamFinished = false;
        speechActive = false;
        if (requestController) requestController.abort();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setReady();
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
